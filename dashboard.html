<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager BR 26 - Central do Treinador</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <!-- Instalador PWA -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>

</head>
<body style="align-items: flex-start;"> <!-- Remove o centralizador do login -->

    <div class="dashboard-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <h2>Manager BR</h2>
            <button class="ativo" onclick="window.location.href='dashboard.html'">📊 Visão Geral</button>
            <button onclick="window.location.href='escalacao.html'">⚽ Tática e Escalação</button>
            <button onclick="window.location.href='calendario.html'">📅 Calendário</button>
            <button onclick="window.location.href='ranking.html'">🏆 Classificação</button>
            <button onclick="window.location.href='mercado.html'">🛒 Mercado</button>
            <button onclick="window.location.href='perfil.html'">👤 Pro Player</button>
            
            <!-- Botão de Destaque para o Jogo -->
            <button style="margin-top: 20px; background-color: #ff8c00; color: #fff; font-weight: bold; text-align: center; border-radius: 6px;" onclick="window.location.href='partida.html'">⚡ IR PARA O JOGO</button>
            
            <button class="btn-sair" onclick="deslogar()">Sair do Jogo</button>
        </aside>

        <!-- Área Principal -->
        <main class="main-content">
            <!-- Barra Superior (Status) -->
            <header class="topbar">
                <div style="display: flex; align-items: center;">
                    <button class="btn-menu" onclick="toggleMenu()">☰</button>
                    <div>
                        <span style="color: #aaa; font-size: 14px;">Treinador:</span> 
                        <strong id="nome-treinador">Carregando...</strong> 
                        <span style="color: #666; margin: 0 10px;">|</span>
                        <span style="color: #aaa; font-size: 14px;">Liga:</span> 
                        <strong id="nome-liga">...</strong>
                    </div>
                </div>
                <div class="info-caixa" id="saldo-treinador">R$ 0,00</div>
            </header>

            <!-- A Tela Muda Dependendo de Ter ou Não Clube -->
            <section class="area-trabalho" id="area-trabalho">
                <h2 style="color: #ff8c00;">Carregando dados do servidor...</h2>
            </section>
        </main>
    </div>

    <!-- Final do dashboard.html (Exemplo) -->
    <script src="js/firebase-config.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/motor.js"></script> <!-- ADICIONE ESTA LINHA -->
</body>
</html>
