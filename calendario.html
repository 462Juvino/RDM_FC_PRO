<!-- calendario.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager BR 26 - Calendário</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body style="align-items: flex-start;">

    <div class="dashboard-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <h2>Manager BR</h2>
            <button onclick="window.location.href='dashboard.html'">📊 Visão Geral</button>
            <button onclick="window.location.href='escalacao.html'">⚽ Tática e Escalação</button>
            <button class="ativo" onclick="window.location.href='calendario.html'">📅 Calendário</button>
            <button onclick="window.location.href='ranking.html'">🏆 Classificação</button>
            <button onclick="window.location.href='mercado.html'">🛒 Mercado</button>
            <button onclick="window.location.href='perfil.html'">👤 Pro Player</button>
            <button style="margin-top: 20px; background-color: #ff8c00; color: #fff; font-weight: bold; border-radius: 6px;" onclick="window.location.href='partida.html'">⚡ IR PARA O JOGO</button>
            <button class="btn-sair" onclick="deslogar()">Sair do Jogo</button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center;">
                    <button class="btn-menu" onclick="toggleMenu()">☰</button>
                    <div>
                        <span style="color: #aaa; font-size: 14px;">Treinador:</span>
                        <strong id="nome-treinador">Carregando...</strong>
                        <span style="color: #666; margin: 0 10px;">|</span>
                        <strong id="nome-time" style="color: var(--verde-campo);">...</strong>
                    </div>
                </div>
                <div class="info-caixa" id="saldo-treinador">R$ 0,00</div>
            </header>

            <section class="area-trabalho">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                    <h2 style="margin: 0;">Calendário Oficial 🗓️</h2>

                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span style="color: #aaa; font-size: 14px;">Rodada Atual: <strong id="lbl-rodada-atual" style="color: var(--verde-campo);">1</strong></span>
                        <select id="seletor-rodada" style="width: auto; padding: 8px; margin: 0; background: #1a1a1a; color: white; border: 1px solid #555; border-radius: 6px;" onchange="renderizarRodada()">
                            <!-- Opções de 1 a 38 geradas via JS -->
                        </select>
                    </div>
                </div>

                <!-- Onde os jogos vão aparecer -->
                <div id="container-jogos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;">
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666;">
                        Buscando tabela de jogos na CBF Virtual...
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/calendario.js"></script>
    <script src="js/motor.js"></script>
</body>
</html>
