<!-- mercado.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager BR 26 - Mercado da Bola</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body style="align-items: flex-start;">

    <div class="dashboard-layout">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <h2>Fut Amigos ⚽</h2>
            <button onclick="window.location.href='dashboard.html'">📊 Visão Geral</button>
            <button onclick="window.location.href='escalacao.html'">⚽ Tática e Escalação</button>
            <button onclick="window.location.href='calendario.html'">📅 Calendário</button>
            <button onclick="window.location.href='ranking.html'">🏆 Classificação</button>
            <button class="ativo" onclick="window.location.href='mercado.html'">🛒 Mercado</button>
            <button onclick="window.location.href='perfil.html'">👤 Pro Player</button>
            <button onclick="window.location.href='pelada.html'">⚽ Pelada (Sorteio)</button>
            <button style="margin-top: 20px; background-color: #ff8c00; color: #fff; font-weight: bold; border-radius: 6px;" onclick="window.location.href='partida.html'">⚡ IR PARA O JOGO</button>
            <button class="btn-sair" onclick="deslogar()">Sair do Jogo</button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center;">
                    <button class="btn-menu" onclick="toggleMenu()">☰</button>
                    <div>
                        <span style="color: #aaa; font-size: 14px;">Treinador:</span>
                        <strong id="nome-treinador">Carregando...</strong>
                        <span style="color: #666; margin: 0 10px;">|</span>
                        <strong id="nome-time" style="color: var(--verde-campo);">...</strong>
                    </div>
                </div>
                <div class="info-caixa" id="saldo-treinador">R$ 0,00</div>
            </header>

            <section class="area-trabalho">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                    <h2 style="margin: 0;">Mercado da Bola 🛒</h2>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="text" id="busca-jogador" placeholder="Nome do Jogador..." style="width: 200px; margin: 0; padding: 8px;">
                        <select id="filtro-posicao" style="width: auto; padding: 8px; margin: 0;" onchange="renderizarMercado()">
                            <option value="TODOS">Todas as Posições</option>
                            <option value="Goleiro">Goleiros</option>
                            <option value="Zagueiro">Zagueiros</option>
                            <option value="Lateral">Laterais</option>
                            <option value="Volante">Volantes</option>
                            <option value="Meia">Meias</option>
                            <option value="Atacante">Atacantes (Todos)</option>
                        </select>
                        <button onclick="pesquisarJogador()" style="width: auto; margin: 0; padding: 8px 15px;">Buscar</button>
                    </div>
                </div>

                <!-- Lista de Jogadores no Mercado -->
                <div style="background: var(--card-bg); border: 1px solid #444; border-radius: 8px; padding: 15px; overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: center; color: #ccc; min-width: 600px;">
                        <thead>
                            <tr style="border-bottom: 1px solid #444;">
                                <th style="text-align: left; padding: 10px; color: var(--verde-campo);">Atleta</th>
                                <th>Posição</th>
                                <th style="color: #ff8c00;" title="Força Total">OVR</th>
                                <th>Clube Atual</th>
                                <th>Passe (Valor)</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-mercado">
                            <tr><td colspan="6" style="padding: 20px;">Carregando banco de dados da FIFA...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>



    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/mercado.js"></script>
    <script src="js/motor.js"></script>
</body>
</html>
