<!-- ranking.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager BR 26 - Classificação</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        .aba-btn {
            background: #2a2a2a; color: #888; border: 1px solid #444; padding: 8px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin: 0; width: auto; font-size: 13px;
        }
        .aba-btn.ativo { background: var(--verde-campo); color: white; border-color: var(--verde-campo); }
        .aba-btn:hover:not(.ativo) { background: #333; color: white; }

        /* Layout Grid da Tela */
        .painel-estatisticas {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .box-tabela { flex: 3; min-width: 600px; background: var(--card-bg); border: 1px solid #444; border-radius: 8px; padding: 15px; overflow-x: auto; }
        .box-rankings { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }

        /* Tabela Visual Sofascore/GE */
        .tabela-ranking { width: 100%; border-collapse: collapse; text-align: center; color: #ccc; font-size: 13px; }
        .tabela-ranking th { padding: 12px 8px; color: #888; border-bottom: 1px solid #444; font-weight: normal; text-transform: uppercase; font-size: 11px; }
        .tabela-ranking td { padding: 10px 8px; border-bottom: 1px solid #333; background: #1a1a1a; transition: 0.2s; }
        .tabela-ranking tr:hover td { background: #252525; }

        /* Célula de Pontos em Destaque */
        .tabela-ranking td.col-pts { font-weight: bold; color: #fff; background: rgba(0,0,0,0.3); }

        /* Bordas de Classificação Laterais */
        .zona-azul td:first-child { border-left: 3px solid #007bff; }
        .zona-verde td:first-child { border-left: 3px solid #28a745; }
        .zona-vermelha td:first-child { border-left: 3px solid #dc3545; }
        .sem-zona td:first-child { border-left: 3px solid transparent; } /* Alinhamento */

        .tabela-ranking td:first-child { font-weight: bold; color: #aaa; width: 30px; }
    </style>
</head>
<body style="align-items: flex-start;">

    <div class="dashboard-layout">
        <!-- Menu Lateral -->
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <h2>Fut Amigos ⚽</h2>
            <button onclick="window.location.href='dashboard.html'">📊 Visão Geral</button>
            <button onclick="window.location.href='escalacao.html'">⚽ Tática e Escalação</button>
            <button onclick="window.location.href='calendario.html'">📅 Calendário</button>
            <button class="ativo" onclick="window.location.href='ranking.html'">🏆 Classificação</button>
            <button onclick="window.location.href='mercado.html'">🛒 Mercado</button>
            <button onclick="window.location.href='perfil.html'">👤 Pro Player</button>
            <button onclick="window.location.href='pelada.html'">⚽ Pelada (Sorteio)</button>
            <button style="margin-top: 20px; background-color: #ff8c00; color: #fff; font-weight: bold; border-radius: 6px;" onclick="window.location.href='partida.html'">⚡ IR PARA O JOGO</button>
            <button class="btn-sair" onclick="deslogar()">Sair do Jogo</button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center;">
                    <button class="btn-menu" onclick="toggleMenu()">☰</button>
                    <div>
                        <span style="color: #aaa; font-size: 14px;">Treinador:</span>
                        <strong id="nome-treinador">Carregando...</strong>
                        <span style="color: #666; margin: 0 10px;">|</span>
                        <strong id="nome-time" style="color: var(--verde-campo);">...</strong>
                    </div>
                </div>
            </header>

            <section class="area-trabalho">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                    <h2 style="margin: 0;">Tabela do Campeonato 🏆</h2>
                    <div style="display: flex; gap: 10px;">
                        <button id="btn-div-A" class="aba-btn ativo" onclick="mudarDivisao('A')">Série A</button>
                        <button id="btn-div-B" class="aba-btn" onclick="mudarDivisao('B')">Série B</button>
                    </div>
                </div>

                <div class="painel-estatisticas">
                    <!-- Tabela de Classificação -->
                    <div class="box-tabela">
                        <table class="tabela-ranking">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th style="text-align: left;">Clube</th>
                                    <th class="col-pts" title="Pontos">Pts</th>
                                    <th title="Jogos">J</th>
                                    <th title="Vitórias">V</th>
                                    <th title="Empates">E</th>
                                    <th title="Derrotas">D</th>
                                    <th title="Gols Pró">GP</th>
                                    <th title="Gols Contra">GC</th>
                                    <th title="Saldo de Gols">SG</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-tabela">
                                <tr><td colspan="10" style="padding: 20px;">Buscando cálculos do servidor...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Rankings Individuais -->
                    <div class="box-rankings">
                        <!-- Artilharia -->
                        <div style="background: var(--card-bg); border: 1px solid #444; border-radius: 8px; padding: 20px;">
                            <h3 style="margin-top: 0; color: #ff8c00; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between;">
                                <span>⚽ Artilharia</span> <span style="font-size: 12px; color: #888; font-weight: normal; margin-top: 4px;">Top 10</span>
                            </h3>
                            <ul id="lista-artilheiros" class="lista-info">
                                <li><span style="color: #666;">Carregando estatísticas...</span></li>
                            </ul>
                        </div>

                        <!-- Assistências -->
                        <div style="background: var(--card-bg); border: 1px solid #444; border-radius: 8px; padding: 20px;">
                            <h3 style="margin-top: 0; color: #00b853; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between;">
                                <span>👟 Assistências</span> <span style="font-size: 12px; color: #888; font-weight: normal; margin-top: 4px;">Top 10</span>
                            </h3>
                            <ul id="lista-assistencias" class="lista-info">
                                <li><span style="color: #666;">Carregando estatísticas...</span></li>
                            </ul>
                        </div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/ranking.js"></script>
    <script src="js/midia.js"></script>
</body>
</html>
